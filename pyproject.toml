[project]
name = "iris-etl"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.0",
    "matplotlib>=3.11.1",
    "mysql-connector-python>=26.7.0",
    "pandas<3",
    "pyspark>=4.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "wget>=3.2",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
reportUnusedCallResult = false

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]
